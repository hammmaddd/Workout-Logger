$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/users/{{userId}}/workouts'
order: 2000
description: Get all workouts for a specific user. Supports pagination via limit and skip query params.
queryParams:
  - key: limit
    value: '10'
    description: Number of workouts to return
  - key: skip
    value: '0'
    description: Number of workouts to skip
  - key: sort
    value: '-date'
    description: 'Sort field. Use - prefix for descending (e.g. -date)'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response has success flag", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });
      pm.test("Response has data array", function () {
        const json = pm.response.json();
        pm.expect(json.data).to.be.an("array");
      });
